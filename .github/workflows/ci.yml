name: NutriTrack CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test NutriTrack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: nutritrack
          POSTGRES_USER: nutritrack
          POSTGRES_PASSWORD: nutritrack_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U nutritrack -d nutritrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # --------------------------------
      # Checkout repository
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Setup PostgreSQL client
      # --------------------------------

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # --------------------------------
      # Initialize database
      # --------------------------------

      - name: Initialize database schema
        env:
          DATABASE_URL: postgresql://nutritrack:nutritrack_password@localhost:5432/nutritrack
        run: |
          psql "$DATABASE_URL" -f database/init/001-schema.sql

      - name: Seed database
        env:
          DATABASE_URL: postgresql://nutritrack:nutritrack_password@localhost:5432/nutritrack
        run: |
          psql "$DATABASE_URL" -f database/init/002-seed.sql

      # --------------------------------
      # Setup Node.js
      # --------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # --------------------------------
      # Backend
      # --------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # --------------------------------
      # Start backend
      # --------------------------------

      - name: Start backend
        working-directory: backend
        env:
          PORT: 3000
          DATABASE_URL: postgresql://nutritrack:nutritrack_password@localhost:5432/nutritrack
          FRONTEND_URL: http://localhost:5173
        run: |
          npm start > backend.log 2>&1 &
          sleep 5

      # --------------------------------
      # Check backend
      # --------------------------------

      - name: Check backend health
        run: |
          curl --fail http://localhost:3000/api/health

      # --------------------------------
      # API Tests
      # --------------------------------

      - name: Run API tests
        env:
          API_URL: http://localhost:3000/api
        run: |
          bash tests/api-tests.sh

      # --------------------------------
      # Show backend logs if needed
      # --------------------------------

      - name: Show backend logs
        if: failure()
        run: |
          echo "===== BACKEND LOGS ====="
          cat backend/backend.log || true

      # --------------------------------
      # Frontend
      # --------------------------------

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build