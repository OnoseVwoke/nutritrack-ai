services:

  database:
    image: postgres:16
    container_name: nutritrack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: nutritrack
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: nutritrack_password

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nutritrack -d nutritrack"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: nutritrack-api
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://nutritrack:nutritrack_password@database:5432/nutritrack
      FRONTEND_URL: http://localhost:5173

    ports:
      - "3002:3000"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: nutritrack-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: